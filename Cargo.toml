[package]
name = "icalc-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
icalendar = { version = "0.17.13", features = ["recurrence"] }
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
